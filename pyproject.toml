[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "microcad"
version = "0.0.1"
authors = [
  { name="Kaustav Gopinathan", email="kaustav.gopinathan@gmail.com" },
]
description = "A scripting language to draw microfluidic chips in Fusion 360 or FreeCAD."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
dependencies = [
  ,
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/kaustavg/microcad"
Issues = "https://github.com/kaustavg/microcad/issues"

[tool.setuptools]
packages = ["microcad"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"microcad" = ["macros/*"]
